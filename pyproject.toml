[project]
name = "vibe-coding"
version = "0.1.0"
description = "Coze Vibe Coding project"
requires-python = ">=3.12"
dependencies = [
    "langchain==1.0.3",
    "langchain-community==0.3.29",
    "langchain-openai==1.0.1",
    "langgraph==1.0.2",
    "langgraph-checkpoint>=3.0.0,<4",
    "langgraph-prebuilt>=1.0.2,<2",
    "langgraph-sdk==0.2.9",
    "langsmith==0.4.39",
    "fastapi>=0.121,<1",
    "uvicorn>=0.38,<1",
    "python-multipart>=0.0.32",
    "pydantic>=2.12,<3",
    "jinja2>=3.1,<4",
    "coze-coding-utils>=0.2.8",
    "coze-workload-identity>=0.1.4,<1",
    "pandas>=2.2,<3",
    "cozeloop>=0.1.25,<1",
    "SQLAlchemy>=2.0,<3",
    "python-dotenv>=1.2,<2",
    "boto3>=1.40,<2",
    "langgraph-checkpoint-postgres>=3.0,<4",
    "psycopg[binary]>=3.3,<4",
    "psycopg-pool>=3.3,<4",
    "openpyxl>=3.1,<4",
    "coze-coding-dev-sdk>=0.5.19",
    "chardet>=5.2,<6",
    "beautifulsoup4>=4.12.0,<5",
    "python-pptx>=1.0.0",
]

[tool.uv]
[[tool.uv.index]]
url = "https://pypi.org/simple/"
default = true


[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio>=0.23,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]